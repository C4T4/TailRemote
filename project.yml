name: TailRemote

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"

packages:
  RoyalVNCKit:
    url: https://github.com/royalapplications/royalvnc.git
    revision: 0a76294a7cdc8616b2eea5fba958415e544ed34b

targets:
  TailRemote:
    type: application
    platform: iOS
    sources:
      - TailRemote
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: RoyalVNCKit
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.TailRemote
        PRODUCT_NAME: TailRemote
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TailRemote
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: TailRemote connects directly to your Mac through your private Tailscale network.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  TailRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TailRemoteTests
    dependencies:
      - target: TailRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.TailRemoteTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
